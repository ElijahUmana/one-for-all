[package]
name = "browser-engine"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "High-level Chromium driver — singleton browser, BrowserContext per session, realistic input."

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
bytes.workspace = true
futures-util.workspace = true
parking_lot.workspace = true
tracing.workspace = true
once_cell.workspace = true
cdp-client = { workspace = true, features = [
    "domain-cache-storage",
    "domain-css",
    "domain-dom-storage",
    "domain-heap-profiler",
    "domain-indexed-db",
    "domain-io",
    "domain-overlay",
    "domain-performance",
    "domain-profiler",
    "domain-service-worker",
    "domain-tracing",
] }
ax-engine = { workspace = true }
focus-manager = { path = "../focus-manager" }
observability = { path = "../observability" }
sandbox = { workspace = true }
libc = "0.2"
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
regex = "1"
tempfile = { workspace = true }

# CDP transport now lives in the dedicated `cdp-client` crate; this crate
# consumes it via `cdp-client::Connection`.

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

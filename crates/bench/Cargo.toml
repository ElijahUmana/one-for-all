[package]
name = "bench"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "SPEC §11 V5 — SLO-gating benchmark suite for one-for-all."

[lib]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
tracing.workspace = true
parking_lot.workspace = true
hdrhistogram.workspace = true
bincode.workspace = true
memmap2.workspace = true
observability = { path = "../observability" }
cdp-client = { path = "../cdp-client", default-features = true, features = ["cdp-essentials"] }
broker = { path = "../broker" }

[dev-dependencies]
criterion = { workspace = true }
tempfile.workspace = true

[[bench]]
name = "cdp_request_per_sec"
harness = false

[[bench]]
name = "frame_capture_to_event"
harness = false

[[bench]]
name = "page_click"
harness = false

[[bench]]
name = "vision_find_text"
harness = false

[[bench]]
name = "sandbox_spawn"
harness = false

[package]
name = "broker"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Long-running daemon multiplexing N session clients onto one Chromium."

[[bin]]
name = "one-for-all-broker"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
bytes.workspace = true
futures-util.workspace = true
parking_lot.workspace = true
tracing.workspace = true
once_cell.workspace = true
dirs.workspace = true
dashmap.workspace = true
arc-swap.workspace = true
nix = { workspace = true }
libc = "0.2"
browser-engine = { path = "../browser-engine" }
cdp-client = { workspace = true }
focus-manager = { path = "../focus-manager" }
chromium-fetcher = { path = "../chromium-fetcher" }
observability = { path = "../observability" }
ax-engine = { path = "../ax-engine" }
sandbox = { workspace = true }
# SPEC §11 V2 — native macOS app control via Accessibility API.
native-control = { workspace = true }
# SPEC §12 U8 — host system-control surface.
system-control = { workspace = true }
# SPEC §12 U9 — PTY-backed terminal surface.
terminal-control = { path = "../terminal-control" }
# SPEC §11 V4 — continuous vision pipeline (capture/diff/OCR/subscribe).
vision = { path = "../vision", features = ["macos-vision"] }
# SPEC §11 V5 — bincode binary topic for vision.frame events; bumpalo
# arenas for per-call hot-path scratch; HDR histograms via observability.
bincode = { workspace = true }
bumpalo = { workspace = true }
hex.workspace = true
base64.workspace = true
regex.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
cdp-client = { workspace = true, features = ["cdp-essentials"] }
dirs = { workspace = true }

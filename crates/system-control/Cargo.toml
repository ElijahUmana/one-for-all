[package]
name = "system-control"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "SPEC §12 U8 — host system device surface (audio/mic/camera/screen/bluetooth/USB/battery/network/process/fsevents/spotlight/metadata)."

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio.workspace = true
tracing.workspace = true
parking_lot.workspace = true
dashmap.workspace = true
base64.workspace = true
nix = { workspace = true, features = ["fs", "process", "signal"] }
plist = "1.7"

[target.'cfg(target_os = "macos")'.dependencies]
# Match native-control's pins exactly so the workspace ships one copy of each
# binding crate (no duplicate-version build hits, no two-source-of-truth risk).
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSString", "NSArray", "NSDictionary", "NSError",
    "NSValue", "NSData", "NSURL", "NSDate", "NSGeometry", "NSObjCRuntime",
    "NSEnumerator", "NSFileManager",
] }
libc = "0.2"

core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = { version = "0.24", features = ["highsierra", "elcapitan"] }
io-kit-sys = "0.4"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tempfile = { workspace = true }

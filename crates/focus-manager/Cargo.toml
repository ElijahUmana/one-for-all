[package]
name = "focus-manager"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "macOS spawn-without-focus-steal for Chromium"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSDate", "NSArray", "NSURL", "NSRunLoop", "NSThread"] }
objc2-app-kit = { version = "0.2", features = ["NSWorkspace", "NSRunningApplication", "NSApplication", "NSResponder", "libc"] }
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[package]
name = "world-model"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Unified five-stream world model: AX structure, capture, lifecycle, window/display state, and cursor/input fused into one atomic snapshot."

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
parking_lot.workspace = true
tracing.workspace = true

native-control = { path = "../native-control" }
system-control = { path = "../system-control" }
vision = { path = "../vision" }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", features = ["highsierra", "elcapitan"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
serde_json.workspace = true
